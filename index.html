function contact(){let social=socialLinks();return `${pageHero('contact',t('contactTitle'),t('contactIntro'))}<section class="content-shell contact-layout"><div class="contact-details"><span class="eyebrow">${t('available')}</span>${site.email?`<a class="contact-email" href="mailto:${esc(site.email)}">${esc(site.email)} ↗</a><button class="copy-button" data-action="copy">${t('copy')} ↗</button>`:`<p class="config-note">${t('configure')}</p>`}<div class="social-block"><span class="eyebrow">${t('follow')}</span><div class="social-links">${social||`<p>${t('noLinks')}</p>`}</div></div></div><form class="contact-form" id="contact-form" novalidate><label>${t('name')}<input name="name" autocomplete="name" required maxlength="120" placeholder="${t('name')}"></label><label>${t('email')}<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>${t('subject')}<input name="subject" required maxlength="160" placeholder="${t('subject')}"></label><label>${t('message')}<textarea name="message" required rows="6" maxlength="5000" placeholder="${t('message')}"></textarea></label><button class="button button-dark" type="submit" ${!site.email?'disabled':''}>${t('send')} ↗</button><p class="form-feedback" role="status" aria-live="polite">${site.email?t('sendInfo'):t('configure')}</p></form></section>`}
function detail(p){const ix=projects.indexOf(p),prev=projects[(ix+projects.length-1)%projects.length],next=projects[(ix+1)%projects.length];const info=[['objective',p.objective],['audience',p.audience],['concept',p.concept],['development',p.process],['typography',p.typography],['rationale',p.rationale]].filter(([,v])=>tr(v));return `<section class="detail-hero content-shell"><div class="detail-back">${link('/campaigns',`← ${t('back')}`,'text-link')}</div><span class="eyebrow">${p.number} / ${esc(tr(p.category))}</span><h1>${esc(tr(p.title))}</h1><p>${esc(tr(p.short))}</p></section><section class="detail-cover ${p.slug} content-shell"><div class="detail-cover-inner">${p.cover?image(p.cover,tr(p.title)):placeholder()}</div></section><section class="content-shell detail-layout"><aside class="detail-aside"><span class="eyebrow">${t('projectInfo')}</span><div><small>${t('designer')}</small><strong>${esc(tr(site.name))}</strong></div><div><small>${t('category')}</small><strong>${esc(tr(p.category))}</strong></div><div><small>${t('location')}</small><strong>${lang==='ar'?'عمّان، الأردن':'Amman, Jordan'}</strong></div></aside><div class="detail-story"><span class="eyebrow">${t('overview')}</span>${info.map(([k,v])=>`<div class="story-row"><h2>${t(k)}</h2><p>${esc(tr(v))}</p></div>`).join('')}${p.palette.length?`<div class="story-row"><h2>${t('palette')}</h2><div class="swatches">${p.palette.map(c=>`<div><span style="background:${/^#[0-9a-f]{3,8}$/i.test(c)?c:'transparent'}"></span><small>${esc(c)}</small></div>`).join('')}</div></div>`:''}</div></section><section class="content-shell gallery-section"><div class="section-heading"><span class="eyebrow">${t('gallery')}</span><h2>${t('galleryTitle')}</h2></div>${p.images.length?`<div class="gallery-grid">${p.images.map((img,i)=>`<button class="gallery-item" data-gallery="${p.slug}" data-index="${i}" aria-label="${esc(tr(img.alt)||t('imageCount')+' '+(i+1))}"><img src="${esc(img.src)}" alt="${esc(tr(img.alt))}" loading="lazy"><span>↗</span></button>`).join('')}</div>`:placeholder()}${p.references?.length?`<div class="references"><h3>${t('references')}</h3>${p.references.map(r=>`<a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener noreferrer">${esc(tr(r.title))} ↗</a>`).join('')}</div>`:''}</section><section class="content-shell project-pagination">${link('/campaigns/'+prev.slug,`<small>${t('prev')}</small><strong>← ${esc(tr(prev.title))}</strong>`)}${link('/campaigns/'+next.slug,`<small>${t('next')}</small><strong>${esc(tr(next.title))} →</strong>`)}</section>${contactStrip()}`}
function notFound(){return `${pageHero('home',t('notFound'))}<div class="content-shell not-found">${link('/',t('goHome')+' ↗','button button-dark')}</div>`}
function render(scroll=false){let p=path();let content=p==='/'?home():p==='/about'?about():p==='/campaigns'?campaigns():p==='/skills'?skills():p==='/contact'?contact():p.startsWith('/campaigns/')?detail(projects.find(x=>'/campaigns/'+x.slug===p)||projects[0]):notFound();if(p.startsWith('/campaigns/')&&!projects.some(x=>'/campaigns/'+x.slug===p))content=notFound();root.innerHTML=header()+`<main id="main">${content}</main>`+footer();document.title=(p==='/'?'LOLIA':p.startsWith('/campaigns/')?(projects.find(x=>'/campaigns/'+x.slug===p)?.title[lang]||'Campaigns'):t(p.slice(1))||'LOLIA')+' — LOLIA';$('meta[name="description"]').content=p==='/'?t('heroCopy'):p.startsWith('/campaigns/')?(tr(projects.find(x=>'/campaigns/'+x.slug===p)?.short))||t('introCopy'):t('introCopy');document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.dataset.theme=theme;document.querySelector('.skip').textContent=lang==='ar'?'تجاوز إلى المحتوى':'Skip to content';if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function navigate(to){if(to!==path()){location.hash=to;menu=false;render(true)}else {menu=false;render()}}
function setLanguage(){lang=lang==='en'?'ar':'en';store.set('lolia-lang',lang);render()}
function setTheme(){theme=theme==='light'?'dark':'light';store.set('lolia-theme',theme);document.documentElement.dataset.theme=theme;render()}
function openBox(slug,index){let p=projects.find(q=>q.slug===slug);if(!p||!p.images[index])return;lightbox={slug,index};drawBox()}
function drawBox(){const p=projects.find(q=>q.slug===lightbox.slug),item=p.images[lightbox.index];$('#lightbox-root').innerHTML=`<div class="lightbox" role="dialog" aria-modal="true" aria-label="${esc(tr(p.title))}"><button class="lightbox-close" data-action="closebox" aria-label="${t('lightboxClose')}">×</button><button class="lightbox-prev" data-action="prevbox" aria-label="${t('prev')}">←</button><figure><img src="${esc(safeSrc(item.src))}" alt="${esc(tr(item.alt))}"><figcaption><span>${esc(tr(item.caption)||tr(item.alt))}</span><span>${lightbox.index+1} / ${p.images.length}</span></figcaption></figure><button class="lightbox-next" data-action="nextbox" aria-label="${t('next')}">→</button></div>`;document.body.classList.add('modal-open');$('.lightbox-close').focus()}
function moveBox(n){if(!lightbox)return;let p=projects.find(q=>q.slug===lightbox.slug);lightbox.index=(lightbox.index+n+p.images.length)%p.images.length;drawBox()}
function closeBox(){lightbox=null;$('#lightbox-root').innerHTML='';document.body.classList.remove('modal-open')}
document.addEventListener('click',e=>{let a=e.target.closest('a[data-link]');if(a){e.preventDefault();navigate(a.getAttribute('href'));return}let g=e.target.closest('[data-gallery]');if(g){openBox(g.dataset.gallery,Number(g.dataset.index));return}let action=e.target.closest('[data-action]')?.dataset.action;if(action==='lang')setLanguage();if(action==='theme')setTheme();if(action==='menu'){menu=!menu;render()}if(action==='top')scrollTo({top:0,behavior:'smooth'});if(action==='copy'&&site.email){navigator.clipboard?.writeText(site.email).then(()=>{let b=e.target.closest('button');if(b)b.textContent=t('copied')}).catch(()=>{})}if(action==='closebox')closeBox();if(action==='prevbox')moveBox(-1);if(action==='nextbox')moveBox(1);if(e.target.classList.contains('lightbox'))closeBox()});
if(site.email&&!safeEmail(site.email))site.email='';
document.addEventListener('submit',e=>{if(e.target.id!=='contact-form')return;e.preventDefault();let f=e.target,feedback=f.querySelector('.form-feedback');if(!f.checkValidity()){f.reportValidity();feedback.textContent=t('invalid');return}if(!site.email){feedback.textContent=t('configure');return}let data=new FormData(f);const subject=encodeURIComponent(data.get('subject'));const body=encodeURIComponent(`${data.get('message')}\n\n${data.get('name')}\n${data.get('email')}`);feedback.textContent=t('sendInfo');location.href=`mailto:${site.email.replace(/[^\w.+@-]/g,'')}?subject=${subject}&body=${body}`});
document.addEventListener('keydown',e=>{if(!lightbox)return;if(e.key==='Escape')closeBox();if(e.key==='ArrowRight')moveBox(1);if(e.key==='ArrowLeft')moveBox(-1)});let touchStart=0;document.addEventListener('touchstart',e=>{if(lightbox)touchStart=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(lightbox&&Math.abs(e.changedTouches[0].clientX-touchStart)>55)moveBox(e.changedTouches[0].clientX<touchStart?1:-1)},{passive:true});window.addEventListener('hashchange',()=>{menu=false;closeBox();render(true)});render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body>
</html>
